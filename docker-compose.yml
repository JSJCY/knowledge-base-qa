services:
  kb-qa:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/kb.db
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - kb_data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kb-qa
    restart: unless-stopped

volumes:
  kb_data:
