name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest + coverage)
        run: pytest --cov=app --cov-report=term

      - name: Evaluation pipeline smoke (no model quality claim)
        run: python -m app.evaluation run --embedding mock --llm mock --task e2e --split all --output artifacts/eval-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-smoke
          path: artifacts/eval-smoke/
